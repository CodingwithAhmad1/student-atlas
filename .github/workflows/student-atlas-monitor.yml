name: Student Atlas source monitor

# Detection only: fetches every cited government page, records changes as
# alerts in the repo, and leaves review/content edits to a human working
# through the Student Atlas content MCP server.

on:
  schedule:
    - cron: "17 5,17 * * *" # every 12 hours
  workflow_dispatch:
    inputs:
      source:
        description: "Only check this source id (citation id)"
        required: false

concurrency:
  group: atlas-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Student Atlas/monitoring/package-lock.json

      - name: Install watcher dependencies
        run: npm ci --prefix "Student Atlas/monitoring"

      - name: Run watcher
        working-directory: Student Atlas/monitoring
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE" ]; then
            npx tsx src/run.ts --source "$SOURCE"
          else
            npx tsx src/run.ts
          fi

      - name: Commit monitoring state to main
        run: |
          git config user.name "atlas-monitor[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add "Student Atlas/monitoring/snapshots" \
                  "Student Atlas/monitoring/archive" \
                  "Student Atlas/frontend/src/data/monitoring"
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Student Atlas monitor: $(date -u +%F) run [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          echo "::error::Could not push monitoring state after 5 attempts."
          exit 1
